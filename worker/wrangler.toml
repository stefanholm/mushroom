# Cloudflare Worker framför Svampradar — origin-fri (R2 + D1 + SMHI-cron).
# Deploy: se worker/README.md
name = "svampradar"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# R2-bucket med allt bakat innehåll (prefix domains/fungi/<TILE_REV>/... i bucketten)
[[r2_buckets]]
binding = "TILES"
bucket_name = "svampradar-tiles"

# D1: signaler/topplista/ents (app_id sätts från dag 1 — schema.sql)
[[d1_databases]]
binding = "DB"
database_name = "svampradar"
database_id = "SKAPA-I-DASHEN-ELLER-VIA-WRANGLER"

# SMHI-cron: baka moln/regn-frames till R2 (kan behöva Workers Paid om >10 ms CPU)
[triggers]
crons = ["0 */6 * * *"]

[vars]
# Publik cache-revision — samma som TILE_VERSION i Node ("r15" idag, "r16" vid nästa helbake)
TILE_REV = "r15"
# App-id i D1-tabellerna (så Bärradar/Blomradar/Pollenradar kan dela DB)
APP_ID = "svampradar"
FREE_HIDE_FRACTION = "0.3"
# Dev-fallback: om satt proxas okända routes hit (Node på Macen). Lämna tom i prod.
ORIGIN_URL = ""
