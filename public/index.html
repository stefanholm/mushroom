<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mushroom</title>
    <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <nav>
        <button id="tab-chat" class="tab active" type="button">Chatt</button>
        <button id="tab-map" class="tab" type="button">Karta</button>
      </nav>

      <section id="pane-chat">
        <h1>Mushroom Chat &mdash; mistral-small-latest</h1>
        <div id="messages"></div>
        <form id="form">
          <input id="input" autocomplete="off" placeholder="Fråga något om svamp..." required />
          <button id="send" type="submit">Skicka</button>
        </form>
      </section>

      <section id="pane-map" hidden>
        <div class="map-controls">
          <select id="species">
            <option value="kantarell">Kantarell</option>
            <option value="trattkantarell">Trattkantarell</option>
            <option value="karljohan">Karljohan</option>
            <option value="svart-trumpetsvamp">Svart trumpetsvamp</option>
          </select>
          <label>
            Opacitet
            <input id="opacity" type="range" min="0" max="100" value="65" />
          </label>
          <label>
            <input id="staticOnly" type="checkbox" />
            Endast habitat (utan väder/säsong)
          </label>
          <label>
            Datum
            <input id="dateSlider" type="range" min="0" max="110" value="0" />
            <span id="dateLabel">nu</span>
          </label>
          <span id="meta"></span>
        </div>
        <div id="map"></div>
      </section>
    </main>
    <script src="/app.js"></script>
    <script type="module" src="/map.js"></script>
  </body>
</html>
